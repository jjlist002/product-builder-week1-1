<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotto Number Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">🌙</button>
    <main class="page-wrap">
        <div class="container">
            <h1>Lotto Number Generator</h1>
            <div class="lotto-rows" id="lotto-rows"></div>
            <button type="button" id="generate-btn">Generate Numbers</button>
        </div>

        <div class="container contact-form">
            <h2>제휴 문의</h2>
            <p class="form-desc">제휴 및 협업 관련 문의를 남겨주세요.</p>
            <form id="contact-form" action="https://formspree.io/f/mzdarzzo" method="POST">
                <div class="form-group">
                    <label for="name">이름 / 회사명</label>
                    <input type="text" id="name" name="name" required placeholder="홍길동 / ABC 주식회사">
                </div>
                <div class="form-group">
                    <label for="email">이메일</label>
                    <input type="email" id="email" name="email" required placeholder="example@email.com">
                </div>
                <div class="form-group">
                    <label for="message">문의 내용</label>
                    <textarea id="message" name="message" rows="4" required placeholder="제휴 관련 내용을 입력해주세요."></textarea>
                </div>
                <button type="submit" class="submit-btn">문의 보내기</button>
            </form>
            <p class="form-status" id="form-status"></p>
        </div>
    </main>
    <script src="main.js"></script>
</body>
</html>
